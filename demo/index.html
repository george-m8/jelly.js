<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jelly — demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #fff;
      color: #111;
      padding: 4rem 2rem;
      max-width: 720px;
      margin: 0 auto;
    }

    small { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: #999; }

    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 1.1;
      margin: 1rem 0 2.5rem;
    }

    h2 { font-size: 2rem; margin: 2rem 0 0.5rem; }

    p { color: #555; line-height: 1.7; max-width: 60ch; margin-bottom: 1rem; }

    nav { display: flex; gap: 2rem; margin: 2rem 0; }
    nav a { font-size: 1.5rem; text-decoration: none; color: #111; }

    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 2rem 0; }

    button {
      font-family: sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      border: 1px solid #111;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #111; color: #fff; }
  </style>
</head>
<body>

  <small>jelly — demo</small>

  <!-- data-reactive="true" marks elements for splitting and physics -->
  <h1 data-reactive="true">Cool Bike Club</h1>

  <nav>
    <a href="#" data-reactive="true">Blog</a>
    <a href="#" data-reactive="true">Events</a>
    <a href="#" data-reactive="true">Contact</a>
  </nav>

  <h2 data-reactive="true">Upcoming Events</h2>

  <!-- data-jelly on any element adds it to the physics system as a whole unit -->
  <svg data-jelly width="48" height="48" viewBox="0 0 48 48" fill="none" style="display:block;margin:2rem 0">
    <circle cx="24" cy="24" r="20" stroke="#111" stroke-width="2"/>
  </svg>

  <!-- data-jelly-nodes: each direct child gets independent physics.
       Shapes (rect, circle) are element-level. Paths get per-point deformation. -->
  <div style="display:flex;gap:2rem;margin:2rem 0;align-items:center">
    <!-- Instagram-style: 3 element-level nodes (rect + 2 circles) -->
    <svg data-jelly-nodes width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="5"/>
      <circle cx="12" cy="12" r="5"/>
      <circle cx="17.5" cy="6.5" r="1" fill="#111" stroke="none"/>
    </svg>
    <!-- TikTok-style: 1 complex path — per-point coordinate deformation -->
    <svg data-jelly-nodes width="48" height="48" viewBox="0 0 24 24" fill="#111">
      <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.34 6.34 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.28 8.28 0 0 0 4.84 1.55V6.79a4.85 4.85 0 0 1-1.07-.1z"/>
    </svg>
    <!-- Simple path: star shape -->
    <svg data-jelly-nodes width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#111" stroke-width="2">
      <path d="M24 4 L28.5 16 L42 16 L31 24.5 L35 37 L24 29.5 L13 37 L17 24.5 L6 16 L19.5 16 Z"/>
    </svg>
  </div>

  <p>Move your mouse over the headings, links, and icons above. Click a link to trigger a ripple. Scroll the page to see inertia.</p>
  <p>Text: <code>[data-reactive="true"]</code>. Whole element: <code>[data-jelly]</code>. Per-node/per-point: <code>[data-jelly-nodes]</code>.</p>

  <div class="controls">
    <button onclick="jelly.configure({ proximity: { pushStrength: 40 } })">More repel</button>
    <button onclick="jelly.configure({ proximity: { pushStrength: 20 } })">Normal repel</button>
    <button onclick="jelly.configure({ ripple: { liftStrength: 32 } })">Stronger ripple</button>
    <button onclick="jelly.configure({ ripple: { liftStrength: 16 } })">Normal ripple</button>
  </div>

  <script src="../jelly.js"></script>
  <script>
    jelly.init();
  </script>

</body>
</html>
